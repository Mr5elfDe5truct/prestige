# Quick checks on every pull request and every push to main: types, unit tests, the web build, and the Rust side.
# No installer is built here (that's build-installer.yml). Run the same checks on the PC with:
#   npm run check; npm test; npx vite build; cd src-tauri; cargo clippy; cargo test
name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Unit tests
        run: npm test

      # Also makes dist/, which the Tauri crate needs to compile.
      - name: Web build
        run: npx vite build

      # Clippy compiles everything cargo check does. Its style warnings are shown but don't fail the run.
      - name: Rust check
        working-directory: src-tauri
        run: cargo clippy --all-targets

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test
