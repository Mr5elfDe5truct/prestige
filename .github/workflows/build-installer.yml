# Builds the unsigned Windows installer on GitHub's servers, as a check that a clean checkout still builds.
# Releases are still made on Ryan's PC with scripts\release.ps1. Prestige isn't code signed: SignPath Foundation
# declined it on 2026-10-13. The SignPath signing steps are in this file's history (PR #79) for a later reapply.
#
#   Run it: Actions > Build installer > Run workflow (or `gh workflow run build-installer.yml --repo Mr5elfDe5truct/prestige`).
name: Build installer

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/build-installer.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: build-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Updater artifacts need the update key, which stays on Ryan's PC.
      - name: Build
        shell: pwsh
        run: |
          '{"bundle":{"createUpdaterArtifacts":false}}' | Set-Content ci-no-updater.json
          npx tauri build --config ci-no-updater.json

      - name: Find the installer
        id: exe
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $exe = "src-tauri/target/release/bundle/nsis/Prestige_${version}_x64-setup.exe"
          if (-not (Test-Path $exe)) { throw "No installer at $exe" }
          "version=$version" >> $env:GITHUB_OUTPUT
          "path=$exe" >> $env:GITHUB_OUTPUT

      - name: Upload unsigned installer
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: prestige-${{ steps.exe.outputs.version }}-unsigned
          path: ${{ steps.exe.outputs.path }}
          if-no-files-found: error
