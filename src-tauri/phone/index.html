<!doctype html>
<!-- Prestige on your phone: a remote for the Prestige desktop app, served by it over your own network (phone.rs).
     Prestige by R.G. Studios · developed by Ryan B. Gyles. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#0a0707" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <title>Prestige</title>
    <style>
      :root {
        --bg: #0a0707; --panel: #120c0c; --panel-2: #1a1111; --line: #2c1c1c; --fg: #efe4d6; --muted: #9c8a7f;
        --red: #d6202b; --red-deep: #7a0d12; --gold: #d9a441; --ok: #58b36a;
        --body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
        color-scheme: dark;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 15px/1.5 var(--body); }
      body { display: flex; flex-direction: column; height: 100dvh; padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left); }
      button { font: inherit; color: inherit; cursor: pointer; }
      [hidden] { display: none !important; }
      header { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); background: linear-gradient(180deg, var(--panel), var(--bg)); }
      .brand { display: flex; flex-direction: column; line-height: 1.1; }
      .brand b { font-family: Georgia, serif; font-size: 19px; letter-spacing: .03em; }
      .brand small { font-size: 9px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
      .grow { flex: 1; }
      .icon { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 10px; border: 1px solid var(--line); background: var(--panel-2); padding: 0; }
      .icon svg { width: 18px; height: 18px; }
      select { max-width: 46vw; background: var(--panel-2); color: var(--fg); border: 1px solid var(--line); border-radius: 999px; padding: 7px 10px; font: 13px var(--body); }
      main { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 14px; -webkit-overflow-scrolling: touch; }
      .msg { max-width: 92%; overflow-wrap: anywhere; }
      .you { align-self: flex-end; background: var(--panel-2); border: 1px solid var(--line); border-radius: 16px 16px 4px 16px; padding: 8px 12px; white-space: pre-wrap; }
      .ai .who { font-size: 12px; font-weight: 600; color: var(--gold); margin-bottom: 2px; }
      .ai .body p { margin: 0 0 8px; }
      .ai .body p:last-child { margin-bottom: 0; }
      .ai .body pre { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px; overflow-x: auto; font: 12.5px var(--mono); white-space: pre; }
      .ai .body code { font: .9em var(--mono); background: var(--panel-2); border-radius: 4px; padding: 1px 4px; }
      .ai .body a { color: var(--gold); }
      .ai .body strong { color: var(--gold); }
      .ai .body h1, .ai .body h2, .ai .body h3 { font-size: 16px; margin: 10px 0 4px; }
      .ai .body ul { margin: 4px 0 8px; padding-left: 20px; }
      .ai.err .body { color: #ff8a8a; }
      .media { display: grid; gap: 6px; }
      .media img, .media video { width: 100%; border-radius: 10px; border: 1px solid var(--line); display: block; }
      .caption { font-size: 12px; color: var(--muted); margin-top: 4px; }
      .chip { display: inline-block; font: 11px var(--mono); color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; margin-bottom: 6px; }
      .status { font: 12px var(--mono); color: var(--muted); }
      .caret { display: inline-block; width: 7px; height: 1em; background: var(--red); vertical-align: -2px; margin-left: 2px; animation: blink .8s steps(2) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .hello { margin: auto; text-align: center; color: var(--muted); padding: 30px 10px; }
      .hello b { display: block; font-family: Georgia, serif; font-size: 22px; color: var(--fg); margin-bottom: 6px; }
      footer { padding: 8px 10px calc(8px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); background: var(--panel); }
      form.composer { display: flex; align-items: flex-end; gap: 8px; }
      textarea { flex: 1; resize: none; max-height: 140px; min-height: 42px; background: var(--panel-2); color: var(--fg); border: 1px solid var(--red-deep); border-radius: 20px; padding: 10px 14px; font: 16px var(--body); }
      .send { background: var(--red); border-color: var(--red); color: #fff; border-radius: 50%; }
      .hint { font-size: 11px; color: var(--muted); margin: 6px 4px 0; }
      .drawer { position: fixed; inset: 0; z-index: 10; background: rgba(0, 0, 0, .6); display: flex; }
      .drawer > div { width: min(84vw, 340px); height: 100%; background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: calc(10px + env(safe-area-inset-top)) 10px 10px; gap: 8px; }
      .drawer .list { overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
      .drawer .item { text-align: left; background: none; border: 0; border-radius: 8px; padding: 9px 10px; }
      .drawer .item.sel, .drawer .item:active { background: var(--panel-2); }
      .drawer .item span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .drawer .item small { color: var(--muted); font: 11px var(--mono); }
      .btn { border: 1px solid var(--line); background: var(--panel-2); border-radius: 8px; padding: 9px 12px; }
      .btn.primary { background: var(--red); border-color: var(--red); color: #fff; font-weight: 600; }
      .pair { margin: auto; width: min(92vw, 380px); display: flex; flex-direction: column; gap: 12px; text-align: center; padding: 20px; }
      .pair img { width: 72px; height: 72px; margin: 0 auto; border-radius: 16px; }
      .pair input { text-align: center; font: 28px var(--mono); letter-spacing: .3em; background: var(--panel-2); color: var(--fg); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
      .pair p { color: var(--muted); margin: 0; font-size: 13.5px; }
      .err-text { color: #ff8a8a; min-height: 1.4em; }
      .msg .shots { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; margin-bottom: 4px; }
      .msg .shots img { width: 96px; height: 96px; object-fit: cover; border-radius: 10px; border: 1px solid var(--line); }
      .ai .tools { display: flex; gap: 6px; margin-top: 6px; }
      .ai .say { background: none; border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; font-size: 12px; color: var(--muted); }
      .media + .body, .caption + .body { margin-top: 8px; }
      .attach-row { display: flex; gap: 8px; padding: 0 2px 8px; overflow-x: auto; }
      .attach-row .a { position: relative; flex: none; }
      .attach-row img { width: 64px; height: 64px; object-fit: cover; border-radius: 10px; border: 1px solid var(--line); display: block; }
      .attach-row button { position: absolute; top: -6px; right: -6px; width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel-2); font-size: 12px; line-height: 1; padding: 0; }
      .icon.on { background: var(--red); border-color: var(--red); color: #fff; }
      .menu { position: fixed; left: 10px; bottom: calc(64px + env(safe-area-inset-bottom)); z-index: 12; background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 4px; display: flex; flex-direction: column; min-width: 190px; }
      .menu button { text-align: left; background: none; border: 0; padding: 11px 12px; border-radius: 8px; }
      .menu button:active { background: var(--panel); }
      .sheet { position: fixed; inset: 0; z-index: 20; background: #000; display: flex; flex-direction: column; }
      .sheet video, .sheet .view { flex: 1; min-height: 0; width: 100%; object-fit: contain; background: #000; }
      .sheet .bar { display: flex; align-items: center; justify-content: space-around; gap: 10px; padding: 14px 14px calc(14px + env(safe-area-inset-bottom)); background: rgba(10, 7, 7, .92); }
      .shutter { width: 70px; height: 70px; border-radius: 50%; border: 4px solid #fff; background: var(--red); padding: 0; }
      .view { display: grid; place-items: center; overflow: auto; }
      .view img, .view video { max-width: 100%; max-height: 100%; }
      .call { position: fixed; inset: 0; z-index: 15; background: radial-gradient(120% 80% at 50% 30%, #2a1010 0%, var(--bg) 60%); display: flex; flex-direction: column; align-items: center; padding: calc(12px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom)); gap: 12px; }
      .seg { display: flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
      .seg button { background: none; border: 0; padding: 8px 20px; font-size: 14px; color: var(--muted); }
      .seg button.sel { background: var(--red); color: #fff; }
      .call video { width: 100%; max-height: 38vh; object-fit: cover; border-radius: 16px; border: 1px solid var(--line); background: #000; }
      .orb { width: 150px; height: 150px; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle, rgba(214, 32, 43, .35), rgba(214, 32, 43, 0) 70%); transition: transform .08s linear; flex: none; }
      .orb img { width: 96px; height: 96px; border-radius: 24px; }
      .call.small .orb { width: 90px; height: 90px; }
      .call.small .orb img { width: 56px; height: 56px; border-radius: 14px; }
      .call-status { font: 13px var(--mono); color: var(--gold); text-align: center; min-height: 1.4em; }
      .call-text { width: 100%; flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; font-size: 15px; }
      .call-text .you { align-self: flex-end; }
      .call-text .re { color: var(--fg); }
      .call-bar { display: flex; gap: 12px; width: 100%; justify-content: center; }
      .call-bar .btn { min-width: 84px; }
      .call-bar .end { background: var(--red); border-color: var(--red); color: #fff; font-weight: 600; }
      .toast { position: fixed; z-index: 30; left: 50%; bottom: 90px; transform: translateX(-50%); background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; font-size: 13px; max-width: 90vw; }
    </style>
  </head>
  <body>
    <section class="pair" id="pair" hidden>
      <img src="/icon.png" alt="" />
      <div class="brand" style="align-items:center"><b>Prestige</b><small>by R.G. Studios</small></div>
      <p>Enter the code from <b>Settings → Phone access</b> on your PC. You only do this once on this phone.</p>
      <input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000" />
      <button class="btn primary" id="pair-btn">Pair this phone</button>
      <div class="err-text" id="pair-err"></div>
    </section>

    <header id="top" hidden>
      <button class="icon" id="menu" aria-label="Chats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10" /></svg></button>
      <div class="brand"><b>Prestige</b><small id="who">by R.G. Studios</small></div>
      <span class="grow"></span>
      <button class="icon" id="call" aria-label="Talk (voice and Live)" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 10v4M8 7v10M12 4v16M16 7v10M20 10v4" /></svg></button>
      <select id="model" aria-label="Model"></select>
    </header>
    <main id="thread" hidden></main>
    <footer id="bottom" hidden>
      <div class="attach-row" id="attach-row" hidden></div>
      <form class="composer" id="composer">
        <button type="button" class="icon" id="attach" aria-label="Add a photo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8h3l2-3h6l2 3h3v11H4z" /><circle cx="12" cy="13" r="3.5" /></svg></button>
        <textarea id="text" rows="1" placeholder="Message Prestige…" enterkeyhint="send"></textarea>
        <button type="button" class="icon" id="mic" aria-label="Dictate" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="3" width="6" height="11" rx="3" /><path d="M5 11a7 7 0 0 0 14 0M12 18v3" /></svg></button>
        <button type="button" class="icon" id="stop" aria-label="Stop" hidden><svg viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="7" width="10" height="10" rx="1" /></svg></button>
        <button type="submit" class="icon send" id="send" aria-label="Send"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h13M13 6l6 6-6 6" /></svg></button>
      </form>
      <p class="hint" id="hint">Runs on your PC (shows there too) · /image, /video, /research and /edit work here</p>
      <input type="file" id="file" accept="image/*" multiple hidden />
    </footer>
    <div class="menu" id="attach-menu" hidden>
      <button type="button" id="take-photo">Take a photo</button>
      <button type="button" id="pick-photo">Choose from gallery</button>
    </div>
    <section class="sheet" id="cam-sheet" hidden>
      <video id="cam-video" playsinline muted autoplay></video>
      <div class="bar">
        <button class="btn" id="cam-close" type="button">Cancel</button>
        <button class="shutter" id="cam-shoot" type="button" aria-label="Take the photo"></button>
        <button class="btn" id="cam-flip" type="button">Flip</button>
      </div>
    </section>
    <section class="sheet" id="viewer" hidden>
      <div class="view" id="viewer-body"></div>
      <div class="bar">
        <button class="btn" id="viewer-close" type="button">Close</button>
        <button class="btn primary" id="viewer-save" type="button">Save to phone</button>
      </div>
    </section>
    <section class="call" id="call-ui" hidden>
      <div class="seg" id="call-mode"><button type="button" data-mode="voice">Voice</button><button type="button" data-mode="live">Live</button></div>
      <video id="call-cam" playsinline muted autoplay hidden></video>
      <div class="orb" id="orb"><img src="/icon.png" alt="" /></div>
      <div class="call-status" id="call-status"></div>
      <div class="call-text" id="call-text"></div>
      <div class="call-bar">
        <button class="btn" id="call-flip" type="button" hidden>Flip</button>
        <button class="btn" id="call-mute" type="button">Mute</button>
        <button class="btn end" id="call-end" type="button">End</button>
      </div>
    </section>
    <div class="drawer" id="drawer" hidden>
      <div>
        <div style="display:flex;gap:8px"><button class="btn primary" id="new-chat" style="flex:1">New chat</button><button class="btn" id="close-drawer">Close</button></div>
        <div class="list" id="chats"></div>
        <span class="grow"></span>
        <button class="btn" id="change-pc" hidden>Connect to another PC</button>
        <button class="btn" id="unpair">Unpair this phone</button>
      </div>
    </div>
    <div class="toast" id="toast" hidden></div>

    <script>
      "use strict";
      const $ = (s) => document.querySelector(s);
      let token = localStorage.getItem("prestige-token") || "";
      let chatId = localStorage.getItem("prestige-chat") || null;
      let chat = null;
      let streaming = null; // { text, el } while a reply streams in
      let busy = false;
      let awaiting = false; // sent a message, waiting for its reply to start
      let es = null;

      const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
      function toast(t) {
        const el = $("#toast");
        el.textContent = t;
        el.hidden = false;
        clearTimeout(el._t);
        el._t = setTimeout(() => (el.hidden = true), 3200);
      }

      /** A small Markdown subset: code blocks, inline code, bold, italic, links, headings, lists. */
      function md(src) {
        const blocks = [];
        let s = esc(src).replace(/```[^\n]*\n?([\s\S]*?)(```|$)/g, (_, code) => `\u0000${blocks.push(code) - 1}\u0000`);
        s = s
          .replace(/`([^`\n]+)`/g, "<code>$1</code>")
          .replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>")
          .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>")
          .replace(/\[([^\]\n]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
        const out = [];
        let list = false;
        for (const line of s.split("\n")) {
          const h = line.match(/^(#{1,3})\s+(.*)/);
          const li = line.match(/^\s*(?:[-*+]|\d+\.)\s+(.*)/);
          if (li) {
            if (!list) out.push("<ul>");
            list = true;
            out.push(`<li>${li[1]}</li>`);
            continue;
          }
          if (list) out.push("</ul>");
          list = false;
          if (h) out.push(`<h${h[1].length + 1}>${h[2]}</h${h[1].length + 1}>`);
          else if (line.trim()) out.push(`<p>${line}</p>`);
        }
        if (list) out.push("</ul>");
        return out.join("").replace(/\u0000(\d+)\u0000/g, (_, i) => `<pre>${blocks[i]}</pre>`);
      }

      async function api(path, opts = {}) {
        const r = await fetch(path, { ...opts, headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}`, ...(opts.headers || {}) } });
        if (r.status === 401) {
          signOut();
          throw new Error("not paired");
        }
        const j = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(j.error || `HTTP ${r.status}`);
        return j;
      }
      const fileUrl = (p) => `/api/file?path=${encodeURIComponent(p)}&t=${encodeURIComponent(token)}`;

      // ---------- pairing ----------
      function showPair() {
        ["#top", "#thread", "#bottom"].forEach((s) => ($(s).hidden = true));
        $("#pair").hidden = false;
        const m = location.hash.match(/code=(\d{6})/);
        if (m) $("#code").value = m[1];
        $("#code").focus();
        // The app opens this page with the code from the QR it scanned: pair straight away.
        if (m && window.PrestigeApp) $("#pair-btn").click();
      }
      function signOut() {
        token = "";
        localStorage.removeItem("prestige-token");
        es?.close();
        showPair();
      }
      $("#pair-btn").addEventListener("click", async () => {
        $("#pair-err").textContent = "";
        const code = $("#code").value.replace(/\D/g, "");
        const name = window.PrestigeApp ? window.PrestigeApp.deviceName() : /iPhone|iPad/.test(navigator.userAgent) ? "iPhone" : /Android/.test(navigator.userAgent) ? "Android phone" : "Browser";
        try {
          const r = await fetch("/api/pair", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ code, name }) });
          const j = await r.json();
          if (!r.ok) throw new Error(j.error || `HTTP ${r.status}`);
          token = j.token;
          localStorage.setItem("prestige-token", token);
          history.replaceState(null, "", "/");
          start();
        } catch (e) {
          $("#pair-err").textContent = e.message;
        }
      });

      // ---------- the chat ----------
      function setBusy(on) {
        busy = on;
        $("#stop").hidden = !on;
        $("#send").disabled = on;
      }

      function bubble(m) {
        const el = document.createElement("div");
        if (m.role === "user") {
          el.className = "msg you";
          el.textContent = m.content;
          if (m.images?.length) {
            const shots = document.createElement("div");
            shots.className = "shots";
            for (const b64 of m.images) {
              const img = document.createElement("img");
              img.src = `data:image/jpeg;base64,${b64}`;
              img.alt = "";
              shots.appendChild(img);
            }
            el.prepend(shots);
          }
          return el;
        }
        el.className = `msg ai${m.error ? " err" : ""}`;
        el.innerHTML = `<div class="who">${esc(m.model || "Prestige")}</div>${m.note ? `<div class="chip">${esc(m.note)}</div>` : ""}<div class="body"></div>`;
        const body = el.querySelector(".body");
        if (m.render) {
          // A finished picture or clip, in the reply that made it (with the model's words under it when a model made it).
          const paths = [m.render.path, ...(m.render.more || [])];
          const media = document.createElement("div");
          media.innerHTML = `<div class="media">${paths
            .map((p) => (m.render.kind === "video" ? `<video controls playsinline preload="metadata" src="${esc(fileUrl(p))}"></video>` : `<img loading="lazy" alt="" data-path="${esc(p)}" src="${esc(fileUrl(p))}" />`))
            .join("")}</div><div class="caption">${esc(m.render.prompt || "")}</div>`;
          media.querySelectorAll("img").forEach((img) => img.addEventListener("click", () => view(img.dataset.path, "image")));
          media.querySelectorAll("video").forEach((v, i) => v.addEventListener("dblclick", () => view(paths[i], "video")));
          el.insertBefore(media, body);
          if (m.render.reply) body.innerHTML = md(m.content || "");
          else body.remove();
        } else body.innerHTML = md(m.content || "");
        if (!m.error && m.content && !(m.render && !m.render.reply)) {
          const tools = document.createElement("div");
          tools.className = "tools";
          tools.innerHTML = `<button type="button" class="say">Read aloud</button>`;
          tools.firstChild.addEventListener("click", () => {
            speech.stop();
            speech.add(m.content);
            speech.end();
          });
          el.appendChild(tools);
        }
        return el;
      }

      function render() {
        const th = $("#thread");
        th.innerHTML = "";
        const msgs = chat?.messages || [];
        if (!msgs.length) th.innerHTML = `<div class="hello"><b>${esc(greeting())}</b>Ask anything. It runs on your PC.</div>`;
        for (const m of msgs) th.appendChild(bubble(m));
        if (streaming) th.appendChild(streaming.el);
        th.scrollTop = th.scrollHeight;
      }
      function greeting() {
        const h = new Date().getHours();
        return h < 5 ? "Good evening" : h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : "Good evening";
      }

      /** Opens a chat (or, with null, a new one). A fetch that fails keeps what's shown: the chat may not be saved yet. */
      async function loadChat(id) {
        chatId = id;
        if (id) localStorage.setItem("prestige-chat", id);
        else localStorage.removeItem("prestige-chat");
        if (!id) {
          chat = null;
          render();
          return;
        }
        try {
          const c = await api(`/api/chat?id=${encodeURIComponent(id)}`);
          if (id !== chatId) return; // another chat was opened meanwhile
          // Only redraw when something changed, so a check doesn't jump the page around.
          const changed = !chat || chat.id !== c.id || chat.updated !== c.updated || (chat.messages || []).length !== (c.messages || []).length;
          chat = c;
          // Its reply is already saved (its "started" came while the phone was asleep): no longer waiting.
          const msgs = c.messages || [];
          if (awaiting && msgs.length && msgs[msgs.length - 1].role === "assistant" && c.updated > sentAt) awaiting = false;
          if (changed) render();
        } catch {
          if (!chat) render();
        }
      }

      /** The reply bubble that streams in (made by "started", or by the first word if "started" went missing). */
      function startStreaming(who, status) {
        streaming = { text: "", el: document.createElement("div") };
        streaming.el.className = "msg ai";
        streaming.el.innerHTML = `<div class="who">${esc(who || "Prestige")}</div><div class="body"><span class="status">${esc(status || "Thinking…")}</span></div>`;
        $("#thread").appendChild(streaming.el);
        $("#thread").scrollTop = $("#thread").scrollHeight;
      }

      async function loadState() {
        try {
          const s = await api("/api/state");
          const sel = $("#model");
          const cur = sel.value || s.model;
          sel.innerHTML = (s.models || []).map((m) => `<option value="${esc(m.key)}">${esc(m.name)}</option>`).join("") || `<option value="">No models</option>`;
          if (cur) sel.value = cur;
          $("#who").textContent = s.character ? `talking to ${s.character}` : "by R.G. Studios";
          pcVoice = s.voice || "af_heart";
          liveAvailable = !!s.live;
          setBusy(!!s.busy);
        } catch {}
      }

      let lastEvent = 0; // when the stream last said anything (it pings every 10 s)

      function onEvent(ev) {
        lastEvent = Date.now();
        if (ev.type === "started") {
          setBusy(true);
          // The reply to what this phone just sent (a new chat gets its id here), or one in the chat that's open,
          // whichever device it was typed on.
          if (awaiting || ev.chatId === chatId) {
            awaiting = false;
            call.started();
            if (ev.chatId !== chatId) {
              chatId = ev.chatId;
              localStorage.setItem("prestige-chat", chatId);
              chat = { id: chatId, title: ev.title || "", messages: [] };
            }
            // The message it answers, shown straight away (the fetch below brings the rest).
            const msgs = chat?.messages || [];
            const last = msgs[msgs.length - 1];
            if (ev.text && !(last && last.role === "user" && last.content === ev.text)) msgs.push({ role: "user", content: ev.text });
            if (chat) chat.messages = msgs;
            streaming = null;
            render();
            startStreaming(ev.who);
            loadChat(chatId);
          }
        } else if (ev.type === "delta" && ev.chatId === chatId) {
          call.delta(ev.text);
          if (!streaming) startStreaming();
          streaming.text += ev.text;
          streaming.el.querySelector(".body").innerHTML = md(streaming.text) + '<span class="caret"></span>';
          $("#thread").scrollTop = $("#thread").scrollHeight;
        } else if (ev.type === "status" && ev.chatId === chatId) {
          if (!streaming) startStreaming();
          if (!streaming.text) streaming.el.querySelector(".body").innerHTML = `<span class="status">${esc(ev.text)}</span>`;
        } else if (ev.type === "done") {
          if (ev.chatId === chatId) call.done();
          setBusy(false);
          if (ev.chatId === chatId) {
            awaiting = false;
            streaming = null;
            chat = chat ? { ...chat, updated: -1 } : chat; // make sure the saved reply replaces the streamed one
            loadChat(chatId);
          }
        } else if (ev.type === "saved" && ev.chatId === chatId && !streaming) {
          loadChat(chatId);
        } else if (ev.type === "live") {
          // The PC opened a chat for the Live call: follow it.
          if (ev.chatId && ev.chatId !== chatId) {
            chatId = ev.chatId;
            localStorage.setItem("prestige-chat", chatId);
            chat = { id: chatId, title: "Live call", messages: [] };
            render();
          }
          call.liveReady(ev.model);
        } else if (ev.type === "error") {
          call.failed(ev.text);
          toast(ev.text);
          awaiting = false;
          if (!ev.busy) setBusy(false);
        } else if (ev.type === "state") loadState();
      }

      function connect() {
        es?.close();
        lastEvent = Date.now();
        es = new EventSource(`/api/events?t=${encodeURIComponent(token)}`);
        es.onopen = () => (lastEvent = Date.now());
        es.onmessage = (e) => {
          try {
            onEvent(JSON.parse(e.data));
          } catch {}
        };
        es.onerror = () => {
          // The browser retries by itself (every 3 s); check we're still paired.
          api("/api/state").catch(() => {});
        };
      }

      /** Back from sleep, another app or a network change: reconnect if the stream went quiet, and catch up. */
      function catchUp() {
        if (!token) return;
        if (!es || es.readyState === 2 || Date.now() - lastEvent > 25000) connect();
        loadState();
        if (chatId && !streaming) loadChat(chatId);
      }
      document.addEventListener("visibilitychange", () => {
        if (!document.hidden) catchUp();
      });
      window.addEventListener("online", catchUp);
      window.addEventListener("pageshow", (e) => e.persisted && catchUp());
      // A watchdog for streams that die silently, and a fallback while a reply runs: look at the saved chat every few
      // seconds, so the page never needs a manual refresh.
      setInterval(() => {
        if (!token || document.hidden) return;
        if (Date.now() - lastEvent > 25000) catchUp();
        else if (awaiting && !chatId && Date.now() - sentAt > 6000) {
          // Sent in a new chat but "started" never came: the PC says which chat it's in.
          api("/api/state").then((s) => {
            if (awaiting && s.chatId) {
              awaiting = false;
              loadChat(s.chatId);
            }
          }).catch(() => {});
        } else if ((busy || awaiting) && chatId && !streaming) loadChat(chatId);
      }, 4000);

      let sentAt = 0;
      /** Sends a message (with photos, or as a turn of a call) to the PC, which runs it in its own chat. */
      async function send(text, extra = {}) {
        try {
          awaiting = true;
          sentAt = Date.now();
          await api("/api/send", { method: "POST", body: JSON.stringify({ chatId, text, model: $("#model").value || null, ...extra }) });
          setBusy(true);
          return true;
        } catch (e) {
          awaiting = false;
          toast(e.message);
          return false;
        }
      }

      $("#composer").addEventListener("submit", async (e) => {
        e.preventDefault();
        const t = $("#text").value.trim();
        if ((!t && !shots.length) || busy) return;
        const images = shots.slice();
        $("#text").value = "";
        $("#text").style.height = "";
        shots = [];
        drawShots();
        if (!(await send(t, images.length ? { images } : {}))) {
          // Not sent: put it back.
          $("#text").value = t;
          shots = images;
          drawShots();
        }
      });
      $("#text").addEventListener("input", () => {
        const ta = $("#text");
        ta.style.height = "auto";
        ta.style.height = `${Math.min(ta.scrollHeight, 140)}px`;
      });
      $("#stop").addEventListener("click", () => api("/api/stop", { method: "POST" }).catch(() => {}));

      // ---------- chats ----------
      async function openDrawer() {
        $("#drawer").hidden = false;
        const box = $("#chats");
        box.innerHTML = `<span class="status">Loading…</span>`;
        try {
          const list = await api("/api/chats");
          box.innerHTML = "";
          for (const c of list) {
            const b = document.createElement("button");
            b.className = `item${c.id === chatId ? " sel" : ""}`;
            b.innerHTML = `<span>${esc(c.title || "Untitled")}</span><small>${esc(new Date(c.updated).toLocaleString(undefined, { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }))}${c.model ? " · " + esc(c.model) : ""}</small>`;
            b.addEventListener("click", () => {
              $("#drawer").hidden = true;
              loadChat(c.id);
            });
            box.appendChild(b);
          }
          if (!list.length) box.innerHTML = `<span class="status">No chats yet.</span>`;
        } catch (e) {
          box.textContent = e.message;
        }
      }
      $("#menu").addEventListener("click", openDrawer);
      $("#close-drawer").addEventListener("click", () => ($("#drawer").hidden = true));
      $("#drawer").addEventListener("click", (e) => {
        if (e.target === $("#drawer")) $("#drawer").hidden = true;
      });
      $("#new-chat").addEventListener("click", () => {
        $("#drawer").hidden = true;
        loadChat(null);
      });
      $("#unpair").addEventListener("click", async () => {
        if (!confirm("Unpair this phone? You'll need the code from the PC to use it again.")) return;
        await api("/api/forget", { method: "POST" }).catch(() => {});
        signOut();
      });

      // ---------- the Android app (PrestigeApp is its bridge; absent in a browser) ----------
      const app = window.PrestigeApp || null;
      // The camera and the microphone need a secure page: the app (it serves this page from the phone itself), or HTTPS.
      const avOk = () => !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia) && window.isSecureContext;
      function micError(e) {
        const n = e && e.name;
        if (n === "NotAllowedError") return app ? "Allow the microphone for Prestige (Android Settings → Apps → Prestige → Permissions)." : "The browser blocked the microphone.";
        if (n === "NotFoundError") return "No microphone found.";
        return `Microphone: ${e && e.message ? e.message : e}`;
      }

      // ---------- speech out: the PC's voice (Kokoro, or VoxCPM2), sentence by sentence as a reply streams ----------
      let pcVoice = "af_heart";
      let liveAvailable = false;
      let outCtx = null;
      let outAnalyser = null;
      function out() {
        if (!outCtx) {
          outCtx = new (window.AudioContext || window.webkitAudioContext)();
          outAnalyser = outCtx.createAnalyser();
          outAnalyser.fftSize = 512;
          outAnalyser.connect(outCtx.destination);
        }
        if (outCtx.state === "suspended") outCtx.resume();
        return outCtx;
      }
      function rms(buf) {
        let s = 0;
        for (let i = 0; i < buf.length; i++) s += buf[i] * buf[i];
        return Math.sqrt(s / buf.length);
      }
      function outLevel() {
        if (!outAnalyser) return 0;
        const b = new Float32Array(outAnalyser.fftSize);
        outAnalyser.getFloatTimeDomainData(b);
        return rms(b);
      }

      /** What a person would read aloud: no code, markdown, links or emoji. */
      function speakable(t) {
        return t
          .replace(/`[^`]*`/g, " ")
          .replace(/\[([^\]]+)\]\([^)]+\)/g, "$1")
          .replace(/https?:\/\/\S+/g, "a link")
          .replace(/[*_#>~|]/g, "")
          .replace(/\p{Extended_Pictographic}/gu, "")
          .replace(/\s+/g, " ")
          .trim();
      }

      const speech = {
        gen: 0,
        pending: "",
        inCode: false,
        open: false, // a reply is still streaming in
        chain: Promise.resolve(),
        queue: [],
        playing: false,
        source: null,
        warned: false,
        onIdle: null,
        get busy() {
          return this.playing || this.queue.length > 0;
        },
        /** More of the reply: whole sentences are sent to the PC's voice as soon as they're complete. */
        add(t) {
          this.open = true;
          this.pending += t;
          const re = /[.!?…]+["')\]]*\s+|\n+/g;
          let last = 0;
          let m;
          while ((m = re.exec(this.pending))) {
            this.say(this.pending.slice(last, m.index + m[0].length));
            last = m.index + m[0].length;
          }
          this.pending = this.pending.slice(last);
        },
        /** The reply is complete. */
        end() {
          this.open = false;
          if (this.pending.trim()) this.say(this.pending);
          this.pending = "";
          this.inCode = false;
          if (!this.busy) this.idle();
        },
        say(s) {
          let keep = "";
          s.split("```").forEach((part, i) => {
            if (i > 0) this.inCode = !this.inCode;
            if (!this.inCode) keep += part;
          });
          const text = speakable(keep);
          if (!/[\p{L}\p{N}]/u.test(text)) return;
          const gen = this.gen;
          this.chain = this.chain.then(() => (gen === this.gen ? this.synth(text) : null)).catch((e) => {
            if (!this.warned) toast(`Couldn't speak: ${e.message}`);
            this.warned = true;
            return null;
          });
          this.queue.push(this.chain);
          this.pump();
        },
        async synth(text) {
          const r = await fetch("/api/tts", { method: "POST", headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` }, body: JSON.stringify({ input: text, voice: pcVoice }) });
          if (!r.ok) {
            const j = await r.json().catch(() => ({}));
            throw new Error(j.error || `HTTP ${r.status}`);
          }
          return out().decodeAudioData(await r.arrayBuffer());
        },
        async pump() {
          if (this.playing) return;
          this.playing = true;
          const gen = this.gen;
          while (this.queue.length && gen === this.gen) {
            const buf = await this.queue[0];
            if (gen !== this.gen) return;
            this.queue.shift();
            if (buf) await this.play(buf);
          }
          if (gen !== this.gen) return;
          this.playing = false;
          if (!this.open) this.idle();
        },
        play(buf) {
          return new Promise((done) => {
            const src = out().createBufferSource();
            src.buffer = buf;
            src.connect(outAnalyser);
            src.onended = () => {
              if (this.source === src) this.source = null;
              done();
            };
            this.source = src;
            src.start();
          });
        },
        /** Silence, now (talking over Prestige, or another reply starting). */
        stop() {
          this.gen++;
          Object.assign(this, { queue: [], pending: "", inCode: false, open: false, playing: false, warned: false, chain: Promise.resolve() });
          try {
            this.source?.stop();
          } catch {}
          this.source = null;
        },
        idle() {
          if (this.onIdle) this.onIdle();
        },
      };

      // ---------- the microphone: mono PCM, cut into utterances by a voice-activity detector in calls ----------
      const mic = {
        stream: null,
        ctx: null,
        node: null,
        src: null,
        rate: 16000,
        onframe: null,
        async open() {
          if (this.stream) return;
          this.stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1 } });
          const AC = window.AudioContext || window.webkitAudioContext;
          try {
            this.ctx = new AC({ sampleRate: 16000 }); // what Whisper wants: small uploads
            this.src = this.ctx.createMediaStreamSource(this.stream);
          } catch {
            this.ctx?.close();
            this.ctx = new AC();
            this.src = this.ctx.createMediaStreamSource(this.stream);
          }
          this.rate = this.ctx.sampleRate;
          this.node = this.ctx.createScriptProcessor(1024, 1, 1);
          this.node.onaudioprocess = (e) => this.onframe && this.onframe(new Float32Array(e.inputBuffer.getChannelData(0)));
          this.src.connect(this.node);
          this.node.connect(this.ctx.destination);
        },
        close() {
          this.stream?.getTracks().forEach((t) => t.stop());
          this.node?.disconnect();
          this.src?.disconnect();
          this.ctx?.close().catch(() => {});
          Object.assign(this, { stream: null, ctx: null, node: null, src: null, onframe: null });
        },
      };

      /** PCM frames as a 16-bit WAV, at about 16 kHz. */
      function wav(chunks, rate) {
        const n = chunks.reduce((a, c) => a + c.length, 0);
        const f = Math.max(1, Math.floor(rate / 16000));
        const len = Math.floor(n / f);
        const sr = Math.round(rate / f);
        const v = new DataView(new ArrayBuffer(44 + len * 2));
        const str = (o, s) => {
          for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i));
        };
        str(0, "RIFF");
        v.setUint32(4, 36 + len * 2, true);
        str(8, "WAVE");
        str(12, "fmt ");
        v.setUint32(16, 16, true);
        v.setUint16(20, 1, true);
        v.setUint16(22, 1, true);
        v.setUint32(24, sr, true);
        v.setUint32(28, sr * 2, true);
        v.setUint16(32, 2, true);
        v.setUint16(34, 16, true);
        str(36, "data");
        v.setUint32(40, len * 2, true);
        let o = 44;
        let acc = 0;
        let k = 0;
        for (const c of chunks)
          for (let i = 0; i < c.length; i++) {
            acc += c[i];
            if (++k === f) {
              const x = Math.max(-1, Math.min(1, acc / f));
              if (o < v.byteLength) v.setInt16(o, x < 0 ? x * 0x8000 : x * 0x7fff, true);
              o += 2;
              acc = 0;
              k = 0;
            }
          }
        return new Blob([v], { type: "audio/wav" });
      }

      /** Whisper on the PC (the voice server). */
      async function transcribe(blob) {
        const fd = new FormData();
        fd.append("file", blob, "speech.wav");
        fd.append("language", "en");
        const r = await fetch("/api/stt", { method: "POST", headers: { Authorization: `Bearer ${token}` }, body: fd });
        const j = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(j.error || `HTTP ${r.status}`);
        return String(j.text || "").trim();
      }
      // What Whisper hears in a cough, a door or silence.
      const NOISE = /^(?:[\W_]*|you|thank you|thanks|thanks for watching|bye|uh+|um+|hmm+)[.!?]*$/i;

      // ---------- dictation: the composer's mic ----------
      let dictating = null;
      $("#mic").addEventListener("click", async () => {
        if (call.on) return;
        if (dictating) {
          const chunks = dictating;
          dictating = null;
          mic.close();
          $("#mic").classList.remove("on");
          if (chunks.length < 6) return;
          $("#text").placeholder = "Transcribing…";
          try {
            const t = await transcribe(wav(chunks, mic.rate));
            if (t && !NOISE.test(t)) {
              const ta = $("#text");
              ta.value = ta.value.trim() ? `${ta.value.trim()} ${t}` : t;
              ta.dispatchEvent(new Event("input"));
            }
          } catch (e) {
            toast(e.message);
          } finally {
            $("#text").placeholder = "Message Prestige…";
          }
          return;
        }
        try {
          await mic.open();
        } catch (e) {
          toast(micError(e));
          return;
        }
        dictating = [];
        mic.onframe = (f) => dictating && dictating.length < 2000 && dictating.push(f);
        $("#mic").classList.add("on");
        toast("Listening. Tap the mic again when you're done.");
      });

      // ---------- photos: taken here or picked from the gallery, sent with the next message ----------
      let shots = [];
      function drawShots() {
        const row = $("#attach-row");
        row.hidden = !shots.length;
        row.innerHTML = "";
        shots.forEach((b64, i) => {
          const d = document.createElement("div");
          d.className = "a";
          d.innerHTML = `<img alt="" /><button type="button" aria-label="Remove">✕</button>`;
          d.querySelector("img").src = `data:image/jpeg;base64,${b64}`;
          d.querySelector("button").addEventListener("click", () => {
            shots.splice(i, 1);
            drawShots();
          });
          row.appendChild(d);
        });
      }
      /** A picture as a base64 JPEG, at most `max` pixels on its longer side. */
      function jpeg(src, w, h, max = 1280, q = 0.85) {
        const k = Math.min(1, max / Math.max(w, h));
        const c = document.createElement("canvas");
        c.width = Math.round(w * k);
        c.height = Math.round(h * k);
        c.getContext("2d").drawImage(src, 0, 0, c.width, c.height);
        return c.toDataURL("image/jpeg", q).split(",")[1];
      }
      async function fileToJpeg(file) {
        const bmp = await createImageBitmap(file, { imageOrientation: "from-image" });
        try {
          return jpeg(bmp, bmp.width, bmp.height);
        } finally {
          bmp.close?.();
        }
      }
      async function openCam(video, facing) {
        const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: facing }, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false });
        video.srcObject = s;
        await video.play().catch(() => {});
        return s;
      }
      const stopStream = (s) => s && s.getTracks().forEach((t) => t.stop());

      $("#attach").addEventListener("click", (e) => {
        e.stopPropagation();
        if (shots.length >= 4) return toast("Up to 4 photos at a time.");
        if (!avOk()) return $("#file").click();
        $("#attach-menu").hidden = !$("#attach-menu").hidden;
      });
      document.addEventListener("click", (e) => {
        if (!e.target.closest("#attach-menu, #attach")) $("#attach-menu").hidden = true;
      });
      $("#pick-photo").addEventListener("click", () => {
        $("#attach-menu").hidden = true;
        $("#file").click();
      });
      $("#file").addEventListener("change", async () => {
        for (const f of [...$("#file").files].slice(0, 4 - shots.length)) {
          try {
            shots.push(await fileToJpeg(f));
          } catch {
            toast("Couldn't read that picture.");
          }
        }
        $("#file").value = "";
        drawShots();
      });

      let camFacing = "environment";
      let camStream = null;
      async function camSheet(on) {
        $("#cam-sheet").hidden = !on;
        stopStream(camStream);
        camStream = null;
        if (!on) return;
        try {
          camStream = await openCam($("#cam-video"), camFacing);
        } catch (e) {
          $("#cam-sheet").hidden = true;
          toast(e && e.name === "NotAllowedError" ? "Allow the camera for Prestige (Android Settings → Apps → Prestige → Permissions)." : `Camera: ${e.message || e}`);
        }
      }
      $("#take-photo").addEventListener("click", () => {
        $("#attach-menu").hidden = true;

      });
      $("#cam-close").addEventListener("click", () => camSheet(false));
      $("#cam-flip").addEventListener("click", () => {
        camFacing = camFacing === "user" ? "environment" : "user";

      });
      $("#cam-shoot").addEventListener("click", () => {
        const v = $("#cam-video");
        if (!v.videoWidth) return;
        shots.push(jpeg(v, v.videoWidth, v.videoHeight));
        drawShots();
        camSheet(false);
      });

      // ---------- a render, full screen (save it to the phone from here) ----------
      let viewing = null;
      function view(path, kind) {
        viewing = { path, kind };
        const b = $("#viewer-body");
        b.innerHTML = kind === "video" ? `<video controls playsinline autoplay></video>` : `<img alt="" />`;
        b.firstChild.src = fileUrl(path);
        $("#viewer").hidden = false;
      }
      $("#viewer-close").addEventListener("click", () => {
        $("#viewer").hidden = true;
        $("#viewer-body").innerHTML = "";
      });
      $("#viewer-save").addEventListener("click", () => {
        if (!viewing) return;
        const name = viewing.path.split(/[\\/]/).pop();
        const url = new URL(fileUrl(viewing.path), location.href).href;
        if (app) app.save(url, name);
        else {
          const a = document.createElement("a");
          a.href = url;
          a.download = name;
          a.click();
        }
      });

      // ---------- calls: Voice (the chat's model) and Live (the Live model, with the camera) ----------
      const STATUS = {
        starting: "Getting ready…",
        listening: "Listening… just talk",
        hearing: "Hearing you…",
        transcribing: "Transcribing…",
        thinking: "Thinking…",
        speaking: "Speaking… talk to interrupt",
      };
      const call = {
        on: false,
        mode: "voice",
        state: "off",
        muted: false,
        cut: false, // the reply being streamed was talked over: ignore the rest of it
        talking: false,
        floor: 0.01,
        loud: 0,
        quiet: 0,
        pre: [],
        frames: [],
        micRms: 0,
        cam: null,
        facing: "user",
        replyEl: null,
        raf: 0,
        wake: null,
        liveTimer: 0,
        // Hooks from the event stream.
        started() {
          if (!this.on) return;
          this.cut = false;
          this.replyEl = null;
        },
        delta(t) {
          if (!this.on || this.cut) return;
          if (!this.replyEl) this.replyEl = line("re", "");
          this.replyEl.textContent += t;
          this.replyEl.scrollIntoView({ block: "end" });
          if (this.state === "thinking") setCallState("speaking");
          speech.add(t);
        },
        done() {
          if (!this.on || this.cut) return;
          speech.end();
        },
        liveReady(model) {
          if (!this.on || this.mode !== "live") return;
          clearTimeout(this.liveTimer);
          setCallState("listening");
          $("#call-status").textContent = `Live with ${model} · ${STATUS.listening}`;
        },
        failed() {
          if (this.on && (this.state === "thinking" || this.state === "starting")) setCallState("listening");
        },
      };

      function line(cls, text) {
        const box = $("#call-text");
        const d = document.createElement("div");
        d.className = cls;
        d.textContent = text;
        box.appendChild(d);
        while (box.children.length > 8) box.firstChild.remove();
        d.scrollIntoView({ block: "end" });
        return d;
      }

      function setCallState(s) {
        call.state = s;
        $("#call-status").textContent = call.muted && s === "listening" ? "Muted" : STATUS[s] || "";
      }

      async function openCall(mode) {
        if (!avOk()) return toast("Voice and Live need the Prestige app on your phone.");
        out(); // audio starts from this tap
        Object.assign(call, { on: true, muted: false, cut: true, talking: false, loud: 0, quiet: 0, pre: [], frames: [], floor: 0.01, replyEl: null });
        $("#call-text").innerHTML = "";
        $("#call-mute").textContent = "Mute";
        $("#call-ui").hidden = false;
        setCallState("starting");
        try {
          await mic.open();
        } catch (e) {
          $("#call-status").textContent = micError(e);
          return;
        }
        if (!call.on) return mic.close();
        mic.onframe = vad;
        speech.onIdle = () => call.on && !call.talking && call.state !== "transcribing" && call.state !== "thinking" && setCallState("listening");
        navigator.wakeLock?.request("screen").then((l) => (call.wake = l)).catch(() => {});
        app?.keepAwake(true);
        animateOrb();
        await setMode(mode);
      }

      async function setMode(mode) {
        if (mode === "live" && !liveAvailable) {
          toast("Live needs Qwen3.5 2B or 4B on the PC. Add one from the model catalog there.");
          mode = "voice";
        }
        const was = call.mode;
        call.mode = mode;
        document.querySelectorAll("#call-mode button").forEach((b) => b.classList.toggle("sel", b.dataset.mode === mode));
        $("#call-ui").classList.toggle("small", mode === "live");
        $("#call-flip").hidden = mode !== "live";
        if (mode === "live") {
          $("#call-cam").hidden = false;
          try {
            stopStream(call.cam);
            call.cam = await openCam($("#call-cam"), call.facing);
          } catch (e) {
            toast(`Camera: ${e.message || e}. Live goes on without it.`);
            $("#call-cam").hidden = true;
          }
          setCallState("starting");
          $("#call-status").textContent = "Getting the PC ready for Live…";
          // The PC makes room on the GPU and says "live" when the call's chat is open.
          clearTimeout(call.liveTimer);
          call.liveTimer = setTimeout(() => call.on && call.state === "starting" && setCallState("listening"), 20000);
          api("/api/live", { method: "POST", body: JSON.stringify({ on: true }) }).catch((e) => {
            toast(e.message);
            setCallState("listening");
          });
        } else {
          stopStream(call.cam);
          call.cam = null;
          $("#call-cam").hidden = true;
          if (was === "live") api("/api/live", { method: "POST", body: JSON.stringify({ on: false }) }).catch(() => {});
          setCallState("listening");
        }
      }

      function endCall() {
        if (!call.on) return;
        call.on = false;
        clearTimeout(call.liveTimer);
        mic.close();
        speech.stop();
        speech.onIdle = null;
        stopStream(call.cam);
        call.cam = null;
        if (call.mode === "live") api("/api/live", { method: "POST", body: JSON.stringify({ on: false }) }).catch(() => {});
        call.wake?.release().catch(() => {});
        call.wake = null;
        app?.keepAwake(false);
        cancelAnimationFrame(call.raf);
        $("#call-ui").hidden = true;
        if (chatId) loadChat(chatId);
      }

      /** Voice-activity detection on each ~64 ms of microphone audio. */
      function vad(f) {
        const r = rms(f);
        call.micRms = r;
        if (!call.on || call.muted || call.state === "starting" || call.state === "transcribing") {
          call.talking = false;
          call.loud = 0;
          return;
        }
        const frameSecs = f.length / mic.rate;
        // While Prestige speaks, only a clearly louder voice counts (echo cancellation takes most of the speaker out).
        const over = speech.busy;
        const thr = over ? Math.max(0.05, call.floor * 8) : Math.max(0.012, call.floor * 3.5);
        if (!call.talking) {
          if (r < thr) call.floor = call.floor * 0.98 + r * 0.02;
          call.pre.push(f);
          while (call.pre.length * frameSecs > 0.35) call.pre.shift(); // the first syllable, from before it was loud enough
          call.loud = r > thr ? call.loud + 1 : 0;
          if (call.loud * frameSecs >= (over ? 0.35 : 0.18)) {
            call.talking = true;
            call.frames = call.pre;
            call.pre = [];
            call.quiet = 0;
            if (speech.busy) speech.stop(); // talked over: Prestige stops speaking at once
            setCallState("hearing");
          }
          return;
        }
        call.frames.push(f);
        call.quiet = r > thr * 0.7 ? 0 : call.quiet + 1;
        const secs = call.frames.length * frameSecs;
        if (call.quiet * frameSecs > (call.mode === "live" ? 0.7 : 0.9) || secs > 30) {
          const frames = call.frames;
          call.talking = false;
          call.frames = [];
          call.loud = 0;
          utterance(frames, secs);
        }
      }

      async function utterance(frames, secs) {
        if (secs < 0.5) return setCallState("listening");
        setCallState("transcribing");
        let text = "";
        try {
          text = await transcribe(wav(frames, mic.rate));
        } catch (e) {
          if (call.on) {
            toast(e.message);
            setCallState("listening");
          }
          return;
        }
        if (!call.on) return;
        if (!text || NOISE.test(text)) return setCallState("listening");
        speech.stop();
        call.cut = true; // what's left of an earlier reply is dropped; "started" opens the new one
        line("you", text);
        setCallState("thinking");
        const extra = { interrupt: true };
        if (call.mode === "live") {
          extra.live = true;
          const v = $("#call-cam");
          if (call.cam && v.videoWidth) extra.images = [jpeg(v, v.videoWidth, v.videoHeight, 768, 0.8)];
        }
        if (!(await send(text, extra))) setCallState("listening");
      }

      function animateOrb() {
        const orb = $("#orb");
        const step = () => {
          if (!call.on) return;
          const lvl = Math.min(1, Math.max(outLevel() * 4, call.talking ? call.micRms * 6 : 0));
          orb.style.transform = `scale(${(1 + lvl * 0.3).toFixed(3)})`;
          call.raf = requestAnimationFrame(step);
        };
        call.raf = requestAnimationFrame(step);
      }

      $("#call").addEventListener("click", () => openCall("voice"));
      $("#call-end").addEventListener("click", endCall);
      $("#call-mode").addEventListener("click", (e) => {
        const b = e.target.closest("button[data-mode]");
        if (b && call.on && b.dataset.mode !== call.mode) setMode(b.dataset.mode);
      });
      $("#call-mute").addEventListener("click", () => {
        call.muted = !call.muted;
        $("#call-mute").textContent = call.muted ? "Unmute" : "Mute";
        if (call.state === "listening" || call.state === "hearing") setCallState("listening");
      });
      $("#call-flip").addEventListener("click", async () => {
        call.facing = call.facing === "user" ? "environment" : "user";
        stopStream(call.cam);
        try {
          call.cam = await openCam($("#call-cam"), call.facing);
        } catch (e) {
          toast(`Camera: ${e.message || e}`);
        }
      });

      // Voice, Live, dictation and the camera show where they can work.
      if (avOk()) {
        $("#call").hidden = false;
        $("#mic").hidden = false;
      } else $("#hint").textContent += " · voice, Live and the camera work in the Prestige Android app";
      if (app) {
        $("#change-pc").hidden = false;
        $("#change-pc").addEventListener("click", () => app.setup());
      }

      function start() {
        $("#pair").hidden = true;
        ["#top", "#thread", "#bottom"].forEach((s) => ($(s).hidden = false));
        loadState();
        loadChat(chatId);
        connect();
      }

      if (token) start();
      else showPair();
    </script>
  </body>
</html>
